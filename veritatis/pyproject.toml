[project]
name = "veritatis"
version = "0.1.0"
requires-python = ">=3.11,<3.13"
dependencies = [
	"fastapi==0.128.0",
	"requests==2.32.3",
	"supabase==2.18.1",
	"uvicorn==0.39.0",
	"pymilvus==2.6.3",
	"python-dotenv==1.2.1",
	"sentence-transformers==2.2.2",
	"huggingface_hub==0.13.4",
	"pytest==8.3.3",
]

[project.optional-dependencies]
# Optional Supabase client dependencies for integrations that need them.
supabase = [
	"supabase",
]

[tool.poetry]
name = "veritatis"
version = "0.1.0"
description = ""
authors = ["Yelnur <adetbekovelnur@gmail.com>"]
readme = "README.md"
packages = [{ include = "veritatis" }]

[tool.poetry.dependencies]
python = ">=3.11,<3.13"
fastapi = "^0.128.0"
requests = "^2.32.3"
supabase = "^2.18.1"
dotenv = "^0.9.9"
pymilvus = "^2.6.3"
uvicorn = "^0.39.0"
sentence-transformers = "^2.2.2"
pytest = "^9.0.1"

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
	"ignore:builtin type SwigPyPacked has no __module__ attribute:DeprecationWarning",
	"ignore:builtin type SwigPyObject has no __module__ attribute:DeprecationWarning",
	"ignore:builtin type swigvarlink has no __module__ attribute:DeprecationWarning",
]


[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
